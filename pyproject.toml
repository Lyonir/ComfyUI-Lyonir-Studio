[project]
name = "comfyui-lyonir-studio"
version = "3.5.14"
description = "Lyonir Studio nodes for ComfyUI: multi-model sampler, resolution, image comparison, persistent image/video galleries and Qwen3-TTS."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["opencv-python>=4.8", "numpy", "Pillow"]

[project.urls]
Repository = "https://github.com/Lyonir/ComfyUI-Lyonir-Studio"
Documentation = "https://github.com/Lyonir/ComfyUI-Lyonir-Studio#readme"

[tool.comfy]
PublisherId = "lyonir-studio"
DisplayName = "Lyonir Studio"
